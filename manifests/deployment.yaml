apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-phoenix-deployment
  labels:
    app: capstone-phoenix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capstone-phoenix
  template:
    metadata:
      labels:
        app: capstone-phoenix
    spec:
      containers:
      - name: phoenix-app
        image: ghcr.io/ferrado21/capstone-phoenix:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
